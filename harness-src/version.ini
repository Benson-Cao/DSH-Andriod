#        `.btn{height:46px}` 等是画布值；手机浏览器里 JS 会整体缩放画板铺满屏
#        `--zoom=(innerWidth-28)/375`，所以你看到的按钮高度 = `46 × zoom`，不是 46px。
#        之前 App 直接用 46dp（画布值）→ 在 411~430dp 机上比设计稿矮一截，用户三次反馈"太低"。
