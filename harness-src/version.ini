# r161：v30.42 —— 真修「无法选择文件夹」+ 补回官方设置「账户」分区（真机全链路验证通过）。
#       根因链（逐层挖出来的，不是猜的）：
#       ① dsh-web-app 的 bundle patch 把 tool-web 设成 disabled:true，而 standard /
#          cordis 等 agent preset 又把它列为必备插件（它自身声明 ctx.web 为 required）
#          → 建会话必报 agent-preset/invalid: tool-web ... never started。dsh 把
#          「选工作区目录」当成新会话的第一步，会话建不出来 → 表现为「选完文件夹
#          工作区没设上」。修法：cordis.patch.yml 追加 tool-web disabled:false。
#          （用户原话「目前还是无法选择文件夹」= 这一条，选择器本身没问题。）
#       ② 启用后立刻暴露第二层：Cannot find module '@mixmark-io/domino'（turndown 的
#          DOM 依赖）。核对发布包发现 domino 只有 8 个条目（源里 1023 个）——**发布
#          bundle 的 tar 在这些目录上是残的**，解包后自然缺文件。
#       ③ 第三层：Android 应用数据目录禁止硬链接（run-as 实测 ln 直接 Permission
#          denied）。dsh 的 session 日志用 link(tmp, finalPath) 做原子发布 → 每次
#          开新会话报 EACCES。修法：dsh-session-persistence-jsonl 加 linkOrRename()，
#          仅对 EACCES/EPERM/EXDEV/ENOSYS/EOPNOTSUPP 降级为 rename（调用方之前已
