# dsh-phone 版本单一来源（single source of truth）
#
# 为什么有这个文件：过去 versionCode 999 硬编码在 01-modify-termux.sh 里，
# 于是每次出包的 versionCode 完全相同 —— 系统无法区分新旧包，只能靠人工把
# APK 改名成 DSH-Phone-v999-r95-*.apk 来讲批次。改名不是版本管理：
#   1. 装错批次时系统不会拦（versionCode 相同 = "同版本覆盖安装"）；
#   2. 文件名与真实版本一旦对不上就无从追溯。
#
# 规则（改这里，不要改脚本里的字面量）：
#   - version_code 必须**递增**。Android 用 versionCode 判「降级安装」并直接
#     拒绝安装，所以新包一定要比旧包大。留出余量，别每次只 +1（要给
#     并行分支/回滚留空间）。
#   - version_name 是人类可读版本，展示在应用信息里，随便改。
#   - 改了 dsh/node 版本后，必须同时递增 version_code，
#     并递增 DshBootstrap.BUNDLE_REV（android-java/.../DshBootstrap.java:37），
#     否则旧安装会命中 stamp **跳过重新解包**，新 bundle 永远装不上。

[version]
# 当前 999 是历史值（硬编码遗留）。下一版请用 1000。
version_code = 1004
version_name = 1.0.0

# 出包批次号，仅用于产物文件名便于人工识别，不参与 Android 版本判定。
# 每次出包 +1。
# r104：顶部状态栏配色与 dsh 首页对齐（DshPalette.systemBar）。
# r105：落地设计系统令牌层（--dsh-*）+ 修对比度公式伽马校正 + 弱化色回调 #5A6D84。
# r106：方案 A（SAF 存储目录）—— 新增 SafConfig/SafTree/SafProxyServer +
#       assets/dsh/saf-fs-shim.js；抽屉加「存储目录」行。见 docs/saf-feasibility.md §7。
# r107：修 saf-fs-shim.js 的 config()↔fs.statSync 无限互递归（真机「自检未通过」的根因：
#       每次 relOf 烧 2200 层栈，dsh 启动被拖死、3080 永不监听）。本地 A/B：改前 75s 未就绪
#       → 改后 6s 就绪。另：MainActivity.onCreate 补一次 SafProxyServer.start（DshService
#       未在 manifest 注册，原「随服务起停」路径是死的 → 会留下 enabled:true 的过期配置）。
# r108：同步回执补 warn 态 —— 有冲突保留时单独分色 + 加粗（mobile.js setSyncResult()，
#       mobile.css .dsh-syc-warn），补齐 V2-b 语义色最后一块。headless Edge 实测三态
#       两套主题对比度全部达标（OK/WARN/ERR 浅色 5.03~12.98:1，深色 6.83~8.60:1）。
# r109：v4 设计稿全量对齐 —— ① 令牌层收口（--dsh-* 双主题 + dsh 语义别名 --dsw-* 重映射）；
#       ② 组件层照抄设计稿 §app atoms（按钮 44/r12 一级实底明暗反转、卡片 r16/p14、
#          行、chip、switch 40×24、Sheet r22/320ms、看板、轨迹、仪表盘、指令列表）；
#       ③ 动效层从 5 档 5 缓动收口到设计稿 07 的 4 档（120/200/320/450）+ 2 条缓动；
#       ④ toast 改为设计稿的居中胶囊（单例复用、纯文字、200ms scale .94→1）；
#       ⑤ 新增 5 个能力屏挂在 harness 自有浮层 #dsh-v4-layer（不进 React 树）：
#          S6 轨迹 / S7 工作区 / S8 任务看板 / S9 操作审批 Sheet / S10 指令面板 +
#          Token 仪表盘；入口 = 抽屉「能力」分组 5 行 + 输入框打「/」唤起指令面板。
#          headless Edge 实测：五屏全部渲染、抽屉 5 行注入成功、exceptions 0。
# r110：修正 3 处与设计稿的像素级偏差（headless Edge 数值化 diff 定位，0 异常）：
#       ① 侧栏「新会话」按钮 min-height 40px→44px（L617 选择器加 body.dsh-drawer-open
#          前缀使其特异性 (0,4,3) 压过 L300 的 (0,4,2)）；
#       ② .dsh-v4-btn / .dsh-v4-btn-sm 补 box-sizing:border-box，带 1px 边框的按钮
#          实测从 46px 回到 44px / 30px；
#       ③ 抽屉一级入口 .d-item（VOzbGW_triggerRow）补 padding:11px 16px（原实测 0）。
#       其余组件经全量 diff 已逐像素对齐，本次无结构性改动。
# r111：对齐用户反馈的两处设计稿偏差（headless Edge + mock bridge 实测，exceptions 0）：
#       ① 「点设置直接跳到通用设置/图一」：healLevel 首开(_lvl===0)判据从
#          settingsListShown()(要求 navList 可见) 放宽为 navListMounted()(只要挂在 DOM)，
#          修首开过渡窗口 navList 短暂不可见被误判成 L3 的问题；仅首开生效，严格不劣化。
#       ② NAS 同步 UI 对齐设计稿 S17：syncPanelHtml() 补同步状态卡(dot+上次成功+范围+每N秒chip)
#          与底部 hintbar；修「运行环境 —— 那些」→「运行环境——那些」；chip 走真实间隔、
#          状态卡走 syncLastResult 真实回执。
# r112：修「点设置直接跳到通用设置/图一」的真机根因（r111 加固不足，真机复现仍落 L3）。
#       根因：dsh 设置面板"记住上次页面"，开屏即落上次的详情页；开屏过渡窗口里
#       navList 尚未渲染到 DOM → healLevel 的 _lvl===0 分支猜成 L3 且不再复审
#       （healLevel 只在 l2/l3 全缺时跑）→ 用户每次点设置都被按在详情页。
#       修法三件套（mobile.js，全带护栏）：
#       ① 首开 fresh 窗口（1.6s）内 healLevel 的 _lvl===0 分支偏好 L2（列表页）；
#       ② fresh 窗口内若 L3 仍被后到事件顶上且 navList 还在 DOM → forceFreshList
#          强制拉回 L2（每轮上限 4 次，防与 React 打架）；
#       ③ 真实用户点 navCell（isTrusted）或抽屉插件深链 tap（data-dsh-deeplink
#          在途标记）一旦发生 → 立即收手，尊重导航；深链两跳 wait-for-l2 逻辑不变。
build_rev = 112

[components]
# 与 node_modules 里实际安装的版本保持一致；升级 dsh 时一并更新。
dsh_version = 0.1.0
node_version = 22.22.2