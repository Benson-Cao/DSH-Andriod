# dsh-phone 版本单一来源（single source of truth）
#
# 为什么有这个文件：过去 versionCode 999 硬编码在 01-modify-termux.sh 里，
# 于是每次出包的 versionCode 完全相同 —— 系统无法区分新旧包，只能靠人工把
# APK 改名成 DSH-Phone-v999-r95-*.apk 来讲批次。改名不是版本管理：
#   1. 装错批次时系统不会拦（versionCode 相同 = "同版本覆盖安装"）；
#   2. 文件名与真实版本一旦对不上就无从追溯。
#
# 规则（改这里，不要改脚本里的字面量）：
#   - version_code 必须**递增**。Android 用 versionCode 判「降级安装」并直接
#     拒绝安装，所以新包一定要比旧包大。留出余量，别每次只 +1（要给
#     并行分支/回滚留空间）。
#   - version_name 是人类可读版本，展示在应用信息里，随便改。
#   - 改了 dsh/node 版本后，必须同时递增 version_code，
#     并递增 DshBootstrap.BUNDLE_REV（android-java/.../DshBootstrap.java:37），
#     否则旧安装会命中 stamp **跳过重新解包**，新 bundle 永远装不上。

[version]
